<!doctype html>
<html lang="uk">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Реєстрація - PinOut</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>🔌 PinOut</h1>
        <nav id="nav"></nav>
    </header>

    <main>
        <h2>Реєстрація</h2>
        <form id="register-form" class="form">
            <label>Ім'я користувача *
                <input name="username" required>
            </label>
            <p id="error-username" class="error"></p>

            <label>Ім'я
                <input name="first_name">
            </label>
            <p id="error-first_name" class="error"></p>

            <label>Прізвище
                <input name="last_name">
            </label>
            <p id="error-last_name" class="error"></p>

            <label>Email *
                <input name="email" type="email" required>
            </label>
            <p id="error-email" class="error"></p>

            <label>Пароль *
                <input name="password" type="password" required>
            </label>
            <p id="error-password" class="error"></p>

            <label>Повторіть пароль *
                <input name="password_confirmation" type="password" required>
            </label>
            <p id="error-password_confirmation" class="error"></p>

            <button type="submit">Зареєструватися</button>
            <p id="error" class="error"></p>
        </form>
        <p>Вже є акаунт? <a href="login.html">Увійти</a></p>
    </main>

    <script src="auth.js"></script>
    <script src="register.js"></script>
</body>
</html>
